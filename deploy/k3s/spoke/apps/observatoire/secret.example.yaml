# NOT APPLIED, NOT LISTED IN kustomization.yaml: the shape of the Secret
# `observatoire`, for reference. The real one is made by create-secret.sh,
# from the workstation, and never committed. Every value below is a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: observatoire
  namespace: observatoire
type: Opaque
stringData:
  # Signs the confirmation and unsubscribe links: changing it invalidates the
  # links in mails already sent. 32 random bytes, base64.
  APP_SECRET: "CHANGE-ME"
  # A Brevo API key (xkeysib-…), not an SMTP key.
  MAILER_DSN: "brevo+api://xkeysib-CHANGE-ME@default"
  # bin/console security:hash-password (in the image), never the password.
  ADMIN_PASSWORD_HASH: "$2y$13$CHANGE-ME"
  # bin/console app:admin:totp; empty = password only.
  ADMIN_TOTP_SECRET: ""
