# TOTP for the one admin account, as in Show me the REX. Enabled when
# ADMIN_TOTP_SECRET is set (App\Security\AdminUser::isTotpAuthenticationEnabled).
scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    # Where generated email codes are kept: the admin is not an entity.
    persister: App\Security\AdminCodePersister
    email:
        enabled: true
        digits: 6
        mailer: App\Security\AdminCodeMailer
        template: admin/2fa.html.twig
    totp:
        enabled: true
        issuer: 'Observatoire post-quantique'
        template: admin/2fa.html.twig
    # The code is asked once per device, then the device is trusted 30 days
    # (AdminUser::getTrustedTokenVersion invalidates them all on a new secret).
    trusted_device:
        enabled: true
        lifetime: 2592000
        extend_lifetime: false
        cookie_name: observatoire_appareil
        cookie_secure: true
        cookie_same_site: strict
        cookie_path: /admin
