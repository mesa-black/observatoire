# TOTP for the one admin account, as in Show me the REX. Enabled when
# ADMIN_TOTP_SECRET is set (App\Security\AdminUser::isTotpAuthenticationEnabled).
scheb_two_factor:
    security_tokens:
        - Symfony\Component\Security\Core\Authentication\Token\UsernamePasswordToken
        - Symfony\Component\Security\Http\Authenticator\Token\PostAuthenticationToken
    totp:
        enabled: true
        issuer: 'Observatoire post-quantique'
        template: admin/2fa.html.twig
