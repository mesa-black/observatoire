security:
    password_hashers:
        App\Security\AdminUser: auto

    providers:
        admin:
            id: App\Security\AdminUserProvider

    firewalls:
        # Everything outside /admin is public and stateless: no firewall, so no
        # session and no cookie for readers.
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin
            form_login:
                login_path: admin_login
                check_path: admin_login
                enable_csrf: true
                default_target_path: admin_index
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # Once logged in, 30 days without logging in again. The cookie is
            # signed with APP_SECRET and with the password hash: a new password
            # signs everyone out. Only sent to /admin, over HTTPS.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000
                always_remember_me: true
                signature_properties: ['password']
                path: /admin
                secure: true
                httponly: true
                samesite: strict
            logout:
                path: admin_logout
                target: admin_login
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true

    access_control:
        - { path: ^/admin/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/admin/deconnexion, roles: PUBLIC_ACCESS }
        - { path: ^/admin/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            App\Security\AdminUser:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
