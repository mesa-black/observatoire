parameters:
    app.releves_dir: '%kernel.project_dir%/releves'
    # Optional monthly probe (k3s-stack, spoke/apps/observatoire/probe-cronjob.yaml) writes here.
    app.probes_dir: '%kernel.project_dir%/var/data/probes'
    # Sablier, from the release the image pins (Dockerfile), and where the
    # result of each check of a relevé's seal is kept.
    env(SABLIER_BIN): '/opt/sablier/bin/sablier'
    app.seals_dir: '%kernel.project_dir%/var/data/seals'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $relevesDir: '%app.releves_dir%'
            string $probesDir: '%app.probes_dir%'
            string $adminEmail: '%env(ADMIN_EMAIL)%'
            string $secret: '%env(APP_SECRET)%'
            string $publicDir: '%kernel.project_dir%/public'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Security\AdminUserProvider:
        arguments:
            $passwordHash: '%env(ADMIN_PASSWORD_HASH)%'
            $totpSecret: '%env(ADMIN_TOTP_SECRET)%'

    App\Releve\SealVerifier:
        arguments:
            $sablierBin: '%env(SABLIER_BIN)%'
            $sealsDir: '%app.seals_dir%'
            # The public keys the seals are checked against: the declaration's.
            $declaration: '%kernel.project_dir%/sablier.json'

    App\Doctrine\SqliteMiddleware:
        tags: [doctrine.middleware]

when@test:
    parameters:
        app.releves_dir: '%kernel.project_dir%/tests/fixtures/releves'
        # A stand-in that answers as Sablier would: the tests run without it.
        env(SABLIER_BIN): '%kernel.project_dir%/tests/fixtures/fake-sablier'
        app.seals_dir: '%kernel.project_dir%/var/test/seals'
    services:
        # No test queries real DNS.
        App\Newsletter\Dns:
            class: App\Tests\Newsletter\FakeDns
        # Read back by the tests to type the mailed code.
        App\Security\AdminCodeStore:
            autowire: true
            public: true
        # Fetched by PreviewTest to sign its own link.
        App\Releve\PreviewLinks:
            autowire: true
            public: true
        # Time stands still in tests, and they move it themselves.
        Psr\Clock\ClockInterface:
            class: Symfony\Component\Clock\MockClock
            public: true
            arguments: ['2026-10-16 12:00:00', 'UTC']
