<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><style>
@font-face { font-family: "Bricolage"; src: url("../public/fonts/bricolage-grotesque-400-normal.woff2"); font-weight: 400; }
@font-face { font-family: "Bricolage"; src: url("../public/fonts/bricolage-grotesque-800-normal.woff2"); font-weight: 800; }
@font-face { font-family: "Serif"; src: url("../public/fonts/instrument-serif-400-normal.woff2"); }
@font-face { font-family: "Serif"; src: url("../public/fonts/instrument-serif-400-italic.woff2"); font-style: italic; }
@font-face { font-family: "Mono"; src: url("../public/fonts/ibm-plex-mono-500-normal.woff2"); }
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.03) 0 1px, transparent 1px 3px), radial-gradient(circle at 25% 40%, #2a0705, #0b0606 60%); color: #ffb3ad; font-family: "Bricolage"; position: relative; overflow: hidden; }
.plaque { position: absolute; left: 60px; top: 175px; width: 430px; padding: 34px 30px 28px; border-radius: 14px; background: #0b0606; text-align: center; transform: rotate(-3deg);
  box-shadow: inset 0 0 0 2px #ff3b30, inset 0 0 0 6px #0b0606, inset 0 0 0 7px rgba(255,59,48,.45), 0 0 50px rgba(255,30,20,.45); }
.plaque::before { content: ""; position: absolute; top: 16px; right: 18px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #ffb3ad, #ff2a1f 45%, #6d0702 75%); box-shadow: 0 0 12px 4px rgba(255,40,30,.85); }
.haut { font: 500 15px/1 "Mono"; letter-spacing: .28em; text-transform: uppercase; color: #ff8a80; }
.nom { display: block; margin: 16px 0 18px; font: 400 56px/.95 "Serif"; white-space: nowrap; color: #ff3b30; text-shadow: 0 0 12px rgba(255,50,40,.8), -2px 0 rgba(0,255,255,.25), 2px 0 rgba(255,0,80,.35); }
.bas { font: 500 16px/1 "Mono"; color: #ff8a80; }
.bas::before { content: ""; display: block; height: 2px; width: 70%; margin: 0 auto 14px; background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
.droite { position: absolute; left: 540px; top: 64px; right: 50px; }
h1 { font: 400 64px/.98 "Serif"; color: #ffd9d5; }
h1 em { color: #ff3b30; text-shadow: 0 0 14px rgba(255,50,40,.6); }
.chiffres { display: flex; gap: 36px; margin-top: 36px; }
.n { font: 400 72px/1 "Serif"; color: #ffd9d5; }
.n.rouge { color: #ff3b30; text-shadow: 0 0 12px rgba(255,50,40,.7); }
.lib { margin-top: 6px; font: 500 16px/1.3 "Mono"; max-width: 260px; color: #ff8a80; }
.pied { position: absolute; left: 540px; bottom: 48px; font: 500 17px/1 "Mono"; color: #c4554c; }
.pied b { color: #ff3b30; }
</style></head><body>
<div class="plaque"><span class="haut">Observatoire</span><span class="nom">Post-quantique</span><span class="bas">Relevé n° 2 · 16 novembre 2026</span></div>
<div class="droite">
  <h1>Ils confient leurs données&nbsp;à&nbsp;l'IA.<br><em>Pour combien de temps&nbsp;?</em></h1>
  <div class="chiffres">
    <div><div class="n">40</div><div class="lib">organisations sur 115 ont un espace chez un fournisseur d'IA</div></div>
    <div><div class="n rouge">15</div><div class="lib">ont un espace chez Cursor, dont le chemin reste classique</div></div>
  </div>
</div>
<p class="pied"><b>observatoire.mesa.black</b> · relevé n° 2</p>
</body></html>
